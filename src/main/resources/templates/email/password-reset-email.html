<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
        }
        .content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 5px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #7f8c8d;
        }
        .warning {
            color: #e74c3c;
            font-weight: bold;
        }
        .token {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Your Password Reset Token</h1>
        </div>
        <div class="content">
            <p>Please use the following token below to reset your TicketProject account password:</p>
            <p style="text-align: center;">
                <span class="token" th:text="${passwordResetToken}"></span>
            </p>
            <p class="warning">
                This password reset token will expire in <span th:text="${expirationHours}"></span> hour(s).
            </p>
            <p>If you did not request to reset your password, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 TicketProject. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
